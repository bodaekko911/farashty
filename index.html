<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<meta name="description" content="Five questions stand between you and your gift.">
<meta property="og:title" content="A little something for you 🎂">
<meta property="og:description" content="Five questions stand between you and your gift.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one centered card on a charcoal grill; a skewer at the top fills with kofta as she answers */
:root {
  --coal: #1c1512;
  --coal-2: #2a201b;
  --grate: #3a2c25;
  --ember: #f2782f;
  --ember-hot: #ffb347;
  --kofta: #8a4a2b;
  --kofta-dark: #5e2f19;
  --parsley: #6fae4f;
  --tahini: #f4e6cf;
  --muted: #bfa98f;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
a.primary { display: block; text-decoration: none; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0 46px, var(--grate) 46px 50px),
    radial-gradient(ellipse at 50% 120%, #4a2414 0%, var(--coal) 60%);
  background-color: var(--coal);
  color: var(--tahini);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* Skewer progress */
.skewer { position: relative; height: 54px; }
.stick {
  position: absolute; left: 0; right: 0; top: 50%; height: 6px; transform: translateY(-50%);
  background: linear-gradient(#d9c3a0, #a88a62); border-radius: 3px;
}
.stick::after {
  content: ""; position: absolute; right: -2px; top: -4px;
  border-left: 18px solid #a88a62; border-top: 7px solid transparent; border-bottom: 7px solid transparent;
}
.pieces { position: absolute; inset: 0 34px 0 14px; display: flex; gap: 6px; align-items: center; }
.piece {
  flex: 1; height: 34px; border-radius: 18px;
  background: var(--coal-2); border: 2px dashed var(--grate);
  transition: background .4s, transform .4s;
}
.piece.on {
  border: none;
  background:
    repeating-linear-gradient(100deg, transparent 0 14px, rgba(30,10,0,.55) 14px 18px),
    radial-gradient(ellipse at 40% 30%, #b0653c, var(--kofta) 55%, var(--kofta-dark));
  box-shadow: 0 0 14px rgba(242,120,47,.45);
  animation: sizzle .5s ease-out;
}
@keyframes sizzle { 0% { transform: scale(.4); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.skewer-label { text-align: center; color: var(--muted); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; }

/* Card */
.card {
  background: var(--coal-2);
  border: 1px solid var(--grate);
  border-radius: 22px;
  padding: 28px 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(34px, 9vw, 52px); color: var(--ember-hot); }
h2 { font-size: clamp(24px, 6vw, 32px); }
p { margin: 0; }
.eyebrow { color: var(--parsley); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
.lede { color: var(--muted); }

.options { display: grid; gap: 10px; }
button, .btn {
  font: inherit; cursor: pointer; border-radius: 14px; border: 2px solid var(--grate);
  background: var(--coal); color: var(--tahini); padding: 14px 16px; text-align: left; font-weight: 600;
  transition: border-color .2s, background .2s, transform .1s;
}
button:hover { border-color: var(--ember); }
button:active { transform: scale(.98); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ember-hot); outline-offset: 2px; }
button.right { border-color: var(--parsley); background: rgba(111,174,79,.15); }
button.wrong { border-color: #c4473a; background: rgba(196,71,58,.12); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
button:disabled { cursor: default; }
.primary {
  background: var(--ember); border-color: var(--ember); color: var(--coal);
  font-family: var(--display); font-weight: 400; font-size: 20px; text-align: center; letter-spacing: .02em;
}
.primary:hover { background: var(--ember-hot); border-color: var(--ember-hot); }

input[type=text] {
  font: inherit; width: 100%; padding: 14px 16px; border-radius: 14px;
  border: 2px solid var(--grate); background: var(--coal); color: var(--tahini);
}
.feedback {
  border-left: 4px solid var(--ember); padding: 10px 14px; background: rgba(242,120,47,.08);
  border-radius: 0 12px 12px 0; font-weight: 600;
}
.feedback.good { border-color: var(--parsley); background: rgba(111,174,79,.1); }

/* Ending */
.finale h1 { font-size: clamp(38px, 11vw, 64px); }
.letter { display: flex; flex-direction: column; gap: 14px; font-size: 18px; }
.sign { font-family: var(--display); color: var(--ember-hot); font-size: 22px; }
.countdown {
  display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
  padding: 16px; border-radius: 16px; background: var(--coal); border: 1px solid var(--grate);
}
.countdown strong { font-family: var(--display); font-weight: 400; font-size: 44px; color: var(--parsley); font-variant-numeric: tabular-nums; line-height: 1; }

/* Sparks */
.spark {
  position: fixed; bottom: -10px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--ember-hot); box-shadow: 0 0 8px var(--ember); pointer-events: none;
  animation: rise linear forwards;
}
@keyframes rise { to { transform: translate(var(--dx), -110vh); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .spark { display: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <div>
    <div class="skewer" aria-hidden="true">
      <div class="stick"></div>
      <div class="pieces" id="pieces"></div>
    </div>
    <p class="skewer-label" id="skewerLabel">Fill the skewer to unlock your gift</p>
  </div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
const questions = [
  {
    type: "choice",
    q: "Let's start easy. What is Farashty's favorite food in the whole world?",
    options: ["Koshary", "Molokhia", "Kofta", "Sushi"],
    answer: 2,
    right: "Obviously. That's why this whole page smells like a grill.",
    wrong: "Are you sure you're Farashty? Try again."
  },
  {
    type: "choice",
    q: "Which song is hers?",
    options: ["Perfect", "Chasing Cars", "Yellow", "Someone Like You"],
    answer: 1,
    right: "Correct. Now it's stuck in his head too, every time he thinks of you.",
    wrong: "Nice song, wrong girl. Try again."
  },
  {
    type: "text",
    q: "Where and when did he say \"I love you\" for the first time?",
    short: "Where and when you first said I love you",
    placeholder: "Type the place and the moment",
    reply: "He remembers that moment exactly. He has been meaning it more every day since."
  },
  {
    type: "text",
    q: "Inside joke check. What comes to your mind when someone says Boulaq El Dakrour?",
    short: "Boulaq El Dakrour",
    placeholder: "Go on, say it",
    reply: "Okay, he is laughing right now wherever he is. Only you two get this one."
  },
  {
    type: "choice",
    q: "Last one. When do we finally see each other again?",
    options: ["When the kofta gets cold", "Tomorrow, in my dreams", "In January", "Next Ramadan"],
    answer: 2,
    right: "January. Every day until then is just a day closer to you.",
    wrong: "Too far, he can't wait that long. Try again."
  }
];

const card = document.getElementById("card");
const piecesEl = document.getElementById("pieces");
const label = document.getElementById("skewerLabel");
let step = -1, filled = 0, answers = [];

questions.forEach(() => {
  const d = document.createElement("div");
  d.className = "piece";
  piecesEl.appendChild(d);
});

function addKofta() {
  piecesEl.children[filled].classList.add("on");
  filled++;
  label.textContent = filled === questions.length
    ? "Skewer complete. Your gift is ready"
    : `${filled} of ${questions.length} kofta on the skewer`;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function nextButton(text) {
  const b = el("button", "primary", text);
  b.addEventListener("click", () => { step++; render(); });
  return b;
}

function render() {
  card.innerHTML = "";
  if (step < 0) return intro();
  if (step >= questions.length) return finale();
  const q = questions[step];
  card.appendChild(el("p", "eyebrow", `Question ${step + 1} of ${questions.length}`));
  card.appendChild(el("h2", "", q.q));

  if (q.type === "choice") {
    const opts = el("div", "options");
    const fb = el("p", "feedback");
    fb.hidden = true;
    q.options.forEach((o, i) => {
      const b = el("button", "", o);
      b.addEventListener("click", () => {
        if (i === q.answer) {
          b.classList.add("right");
          opts.querySelectorAll("button").forEach(x => x.disabled = true);
          fb.textContent = q.right; fb.className = "feedback good"; fb.hidden = false;
          addKofta();
          card.appendChild(nextButton(step === questions.length - 1 ? "Grill my gift" : "Next"));
        } else {
          b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
          fb.textContent = q.wrong; fb.className = "feedback"; fb.hidden = false;
        }
      });
      opts.appendChild(b);
    });
    card.appendChild(opts);
    card.appendChild(fb);
  } else {
    const id = "answer" + step;
    const input = el("input");
    input.type = "text"; input.id = id; input.placeholder = q.placeholder;
    input.setAttribute("aria-label", q.q);
    const send = el("button", "primary", "Send");
    const go = () => {
      if (!input.value.trim()) { input.focus(); return; }
      answers[step] = { q: q.short, a: input.value.trim() };
      input.disabled = true; send.remove();
      const fb = el("p", "feedback good", q.reply);
      card.appendChild(fb);
      addKofta();
      card.appendChild(nextButton("Next"));
    };
    send.addEventListener("click", go);
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    card.appendChild(input);
    card.appendChild(send);
    setTimeout(() => input.focus(), 50);
  }
}

function intro() {
  card.appendChild(el("p", "eyebrow", "A birthday quiz for one person only"));
  card.appendChild(el("h1", "", "Happy Birthday, Farashty"));
  card.appendChild(el("p", "lede", "There's a gift waiting for you at the end, but first you have to prove you're really you. Answer five questions to load the skewer with kofta. Wrong answers are allowed. Giving up is not."));
  card.appendChild(nextButton("Fire up the grill"));
}

function monthsToJanuary() {
  const now = new Date();
  if (now.getMonth() === 0) return 0;
  // whole months left until January 1 (late October counts as 2)
  return 12 - now.getMonth() - (now.getDate() > 1 ? 1 : 0);
}

function finale() {
  card.classList.add("finale");
  card.appendChild(el("p", "eyebrow", "Skewer complete"));
  card.appendChild(el("h1", "", "Happy Birthday, Mon âme"));
  const letter = el("div", "letter");
  [
    "Another year of you, and I still can't believe I get to call you mine.",
    "I hate that I'm not there today. I hate that our calls always end too soon, and that I can't hand you your cake myself. But I would still choose these miles with you over anyone close.",
    "Thank you for staying, for being patient with me, and for making my worst days better with one message. You are my favorite person in the world.",
    "So today, eat kofta (obviously), play Chasing Cars as loud as you want, and remember that someone far away is smiling because you were born."
  ].forEach(t => letter.appendChild(el("p", "", t)));
  card.appendChild(letter);
  const cd = el("div", "countdown");
  const m = monthsToJanuary();
  if (m > 0) {
    cd.appendChild(el("strong", "", String(m)));
    cd.appendChild(el("span", "", (m === 1 ? "month" : "months") + " until January, and then I finally get to hold you."));
  } else {
    cd.appendChild(el("strong", "", "January"));
    cd.appendChild(el("span", "", "is here, and I finally get to hold you."));
  }
  card.appendChild(cd);
  card.appendChild(el("p", "sign", "Yours, always ❤"));
  const lines = ["My birthday quiz answers 🎂", ""];
  answers.filter(Boolean).forEach(x => lines.push(x.q + ": " + x.a));
  lines.push("", "Kofta skewer complete ✅");
  const wa = el("a", "btn primary", "Send my answers to him");
  wa.href = "https://wa.me/?text=" + encodeURIComponent(lines.join("\n"));
  wa.target = "_blank"; wa.rel = "noopener";
  card.appendChild(wa);
  const again = el("button", "", "Play again");
  again.addEventListener("click", () => {
    step = -1; filled = 0; answers = []; card.classList.remove("finale");
    [...piecesEl.children].forEach(p => p.classList.remove("on"));
    label.textContent = "Fill the skewer to unlock your gift";
    render();
  });
  card.appendChild(again);
  sparks();
}

function sparks() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < 60; i++) {
    const s = el("span", "spark");
    s.style.left = Math.random() * 100 + "vw";
    s.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    s.style.animationDuration = (2.5 + Math.random() * 3) + "s";
    s.style.animationDelay = (Math.random() * 1.5) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 7500);
  }
}

render();
</script>
</body>
</html>
